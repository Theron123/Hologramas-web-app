<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>HoloForge — Simulador de Sensor Facial</title>
    <style>
        :root {
            --holo-cyan: #00d4ff;
            --holo-purple: #7800ff;
            --holo-green: #00ff88;
            --holo-red: #ff3b30;
            --bg-dark: #070b13;
            --panel-bg: rgba(13, 20, 35, 0.7);
            --border-glow: rgba(0, 212, 255, 0.2);
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
            background: linear-gradient(90deg, var(--holo-cyan), var(--holo-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        p.subtitle {
            font-size: 13px;
            color: #8f9cae;
            margin: 0;
        }

        .main-container {
            display: flex;
            width: 100%;
            height: calc(100% - 100px);
            gap: 20px;
            max-width: 1400px;
        }

        .control-panel {
            flex: 0 0 280px;
            background: var(--panel-bg);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--holo-cyan);
            border-bottom: 1px solid rgba(0, 212, 255, 0.15);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #ffffff;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-left {
            border-color: rgba(255, 59, 48, 0.3);
        }
        .btn-left:hover {
            background: rgba(255, 59, 48, 0.15);
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.4);
            border-color: var(--holo-red);
        }

        .btn-center {
            border-color: rgba(0, 255, 136, 0.3);
        }
        .btn-center:hover {
            background: rgba(0, 255, 136, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            border-color: var(--holo-green);
        }

        .btn-right {
            border-color: rgba(0, 122, 255, 0.3);
        }
        .btn-right:hover {
            background: rgba(0, 122, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 122, 255, 0.4);
            border-color: #007aff;
        }

        .btn-none {
            border-color: rgba(255, 255, 255, 0.1);
        }
        .btn-none:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .viewer-container {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        .status-display {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            font-size: 11px;
            font-family: monospace;
            color: #a0aec0;
            min-height: 50px;
            word-break: break-all;
        }

        .status-val {
            color: var(--holo-cyan);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>HoloForge AI — Simulador de Sensor</h1>
        <p class="subtitle">Integracción con Detección de Posición Facial (DISPL Designer)</p>
    </header>

    <div class="main-container">
        <!-- Panel de Control de Simulación -->
        <div class="control-panel">
            <div>
                <div class="section-title">Controles de Simulación</div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button class="btn btn-left" onclick="sendPosition('LEFT')">
                        🔴 Mover a la Izquierda (LEFT)
                    </button>
                    <button class="btn btn-center" onclick="sendPosition('CENTER')">
                        🟢 Mover al Centro (CENTER)
                    </button>
                    <button class="btn btn-right" onclick="sendPosition('RIGHT')">
                        🔵 Mover a la Derecha (RIGHT)
                    </button>
                    <button class="btn btn-none" onclick="sendPosition('NONE')">
                        ⚪ Reiniciar Sensor (NONE)
                    </button>
                </div>
            </div>

            <div style="margin-top: auto;">
                <div class="section-title">Estado del Evento</div>
                <div class="status-display" id="log">
                    Listo. Haz clic en un botón para enviar un evento <span class="status-val">postMessage</span> al visor 3D en el iframe.
                </div>
            </div>
        </div>

        <!-- Visor Holográfico del Iframe -->
        <div class="viewer-container">
            <iframe id="holoforge-frame" src="http://localhost:3000"></iframe>
        </div>
    </div>

    <script>
        const iframe = document.getElementById('holoforge-frame');
        const logEl = document.getElementById('log');

        function sendPosition(position) {
            const payload = {
                type: 'FACE_POSITION',
                position: position
            };
            
            // Enviar mensaje al iframe de HoloForge
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage(payload, '*');
                
                let color = '#a0aec0';
                if (position === 'LEFT') color = '#ff3b30';
                if (position === 'CENTER') color = '#00ff88';
                if (position === 'RIGHT') color = '#007aff';
                
                logEl.innerHTML = `Mensaje enviado:<br><span style="color: ${color}; font-weight: bold;">postMessage(${JSON.stringify(payload)})</span><br>Hora: ${new Date().toLocaleTimeString()}`;
            } else {
                logEl.innerHTML = `<span style="color: #ff9500;">Error: No se pudo acceder al iframe. Asegúrate de que HoloForge esté corriendo en localhost:3000.</span>`;
            }
        }
    </script>
</body>
</html>
